<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HLSTM Orchestral Generation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Lightbox overlay */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 50;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }
  .lightbox img {
    max-width: 90%;
    max-height: 90%;
  }
</style>
</head>
<body class="bg-gray-50 text-gray-800">

<header class="sticky top-0 bg-white shadow p-4 flex gap-4">
  <a href="#master" class="text-blue-600 hover:underline">Master</a>
  <a href="#experiments" class="text-blue-600 hover:underline">Experiments</a>
</header>

<div class="container mx-auto p-4">

  <!-- Master Section -->
  <div id="master" class="bg-white shadow rounded p-4 mb-8">
  <h2 class="text-2xl font-bold mb-4">Master Song</h2>

  <!-- Audio -->
  <audio controls class="w-full mb-4" src="assets/master.wav"></audio>

  <!-- Images side by side -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <img
      class="w-full h-96 object-cover cursor-pointer rounded shadow"
      src="assets/master_piano_roll.png"
      alt="Piano Roll"
    >
    <img
      class="w-full h-96 object-cover cursor-pointer rounded shadow"
      src="assets/master_muse_score.png"
      alt="Muse Score"
    >
  </div>
</div>


  <!-- Experiments Section -->
  <div id="experiments">
    <h2 class="text-2xl font-bold mb-4">Experiments</h2>
    <div id="experiment-container" class="grid grid-cols-1 gap-8">
      <!-- Dynamic experiment blocks go here -->
    </div>
  </div>

</div>

<!--&lt;!&ndash; Lightbox Overlay &ndash;&gt;-->
<!--<div id="lightbox" class="lightbox flex" onclick="this.style.display='none'">-->
<!--  <img id="lightbox-img" src="">-->
<!--</div>-->

<!-- Lightbox Overlay -->
<div id="lightbox" class="fixed hidden z-50 top-0 left-0 w-full h-full bg-black bg-opacity-80 flex justify-center items-center" onclick="this.style.display='none'">
  <img id="lightbox-img" class="max-w-[90%] max-h-[90%]" src="">
</div>

<script>
const experimentFolders = ['4','3','2','1'];
const experimentTitleMap = {
  '1': 'Vanilla Generate',
  '2': 'Natural Generate',
  '3': 'Forceful Generate',
  '4': 'Preset Generation'
};
const instrumentsUsed = "[42, 73, 36]";
const temperature = 0.7;
const top_k=20;
const top_p=0.9;
const num_steps=100;
const style = "1, Contemporary";
const preset = "Gentle";
const seq_length = 128;

const hyperparamsMap = {
  '1': `style=${style}, num_steps=${num_steps}, temperature=${temperature}, top_k=${top_k}, instruments_allowed = ${instrumentsUsed}`,
  '2': `style=${style}, num_steps=${num_steps}, temperature=${temperature}, top_k=${top_k}, instruments_allowed = ${instrumentsUsed}, seq_length=${seq_length}`,
  '3': `style=${style}, num_steps=${num_steps}, temperature=${temperature}, top_k=${top_k}, instruments_allowed = ${instrumentsUsed}, seq_length=${seq_length}, top_p=${top_p}`,
  '4': `preset_name=${preset}, style=${style}, num_steps=${num_steps}, temperature=${temperature}, top_k=${top_k}, instruments_allowed = ${instrumentsUsed}, seq_length=${seq_length}, top_p=${top_p}`
};

// Number of samples per experiment
const numSamples = 3;

// Container
const container = document.getElementById('experiment-container');

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  lb.classList.remove('hidden');
}

function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.add('hidden');
}

// Helper to create image element with lightbox
function createImage(src, alt) {
  const img = document.createElement('img');
  img.src = src;
  img.alt = alt;
  img.className = 'cursor-pointer rounded shadow';
  img.onclick = () => {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  };
  return img;
}

experimentFolders.forEach(folder => {
  const div = document.createElement('div');
  div.className = 'bg-white shadow rounded p-4';

  // Append experiment title
const title = document.createElement('h3');
title.className = 'text-xl font-semibold mb-2';
title.textContent = experimentTitleMap[folder];
div.appendChild(title);

// Append hyperparameters under the title
const hyperparams = document.createElement('p');
hyperparams.className = 'text-sm text-gray-600 mb-4';
hyperparams.innerHTML = `<strong>Generational Hyperparameters:</strong> ${hyperparamsMap[folder]}`;
div.appendChild(hyperparams);

// Append generations comparison plot once per experiment
const comparisonImg = createImage(
  `assets/metrics_plots/${folder}/generations_comparison.png`,
  'Generations Comparison'
);
comparisonImg.className += ' mb-4 w-full h-auto'; // make it full width
div.appendChild(comparisonImg);

// Now add each sample individually
for (let i = 1; i <= numSamples; i++) {
  const sampleDiv = document.createElement('div');
  sampleDiv.className = 'mb-6';

  // Sample heading
  const sampleTitle = document.createElement('h4');
  sampleTitle.className = 'text-lg font-medium mb-2';
  sampleTitle.textContent = `Sample ${i}`;
  sampleDiv.appendChild(sampleTitle);

  // Audio
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.src = `assets/wav/${folder}/sample_${i}_song.wav`;
  audio.className = 'w-full mb-2';
  sampleDiv.appendChild(audio);

  // Images grid for this sample (exclude generation comparison)
  const imgGrid = document.createElement('div');
  imgGrid.className = 'grid grid-cols-2 md:grid-cols-3 gap-4 mb-2';
  imgGrid.appendChild(createImage(`assets/generation_plots/${folder}/sample_${i}_piano_roll.png`, 'Piano Roll'));
  imgGrid.appendChild(createImage(`assets/generation_plots/${folder}/sample_${i}_velocity.png`, 'Velocity Plot'));
  imgGrid.appendChild(createImage(`assets/metrics_plots/${folder}/sample_${i}_metrics.png`, 'Metrics'));

  sampleDiv.appendChild(imgGrid);
  div.appendChild(sampleDiv);
}

// Finally append the entire experiment block to container
container.appendChild(div);

});
</script>

</body>
</html>
